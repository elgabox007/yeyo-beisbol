<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yeyo Úraga · Béisbol</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#040a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yeyo Úraga">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap">
<style>
:root{--bg:#070f24;--bar:#040a1a;--card:#0f1d3f;--tx:#f5f8ff;--mu:#a9b8d6;--ln:#23396b;--g1:#7eb0ee;--g2:#0063b8;--gold:#f5c451;--bt:#fff;
--hf:"Oswald",Impact,"Arial Narrow",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eaf1fc;--card:#fff;--tx:#0b1730;--mu:#53638a;--ln:#cfdbf0;color-scheme:light}}
:root[data-theme="dark"]{--bg:#070f24}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Helvetica Neue",Arial,sans-serif;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:10}
h1,h2,h3,.tm,.dt b,.n,.base,.stat b{font-family:var(--hf);text-transform:uppercase;letter-spacing:.5px}
header{background:var(--bar);display:flex;align-items:center;gap:16px;padding:10px 5vw;position:sticky;top:env(safe-area-inset-top,0px);z-index:9;flex-wrap:wrap;border-bottom:2px solid var(--gold)}
.logo{font-family:var(--hf);font-size:20px;display:flex;gap:10px;align-items:center;color:#fff}
.logo img{height:46px;width:auto}
nav{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
nav button{background:none;border:0;color:#cfd9f0;font:inherit;font-size:14px;padding:7px 13px;cursor:pointer;border-radius:8px}
nav button.on{color:#fff;font-weight:700;background:linear-gradient(135deg,var(--g1),var(--g2))}
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));color:var(--bt);border:0;border-radius:10px;padding:12px 24px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 20px #0063b866;transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:linear-gradient(135deg,#ffe08a,var(--gold));color:#2a1d00;box-shadow:0 6px 20px #f5c45155}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--ln);box-shadow:none}
.cats{display:flex;gap:8px;padding:12px 5vw;background:#06122b;overflow-x:auto}
.cats button{background:none;border:1px solid #2a4278;color:#cfd9f0;font-family:var(--hf);font-size:16px;padding:5px 20px;border-radius:20px;cursor:pointer;white-space:nowrap}
.cats button.on{background:linear-gradient(135deg,#ffe08a,var(--gold));color:#2a1d00;border-color:transparent}
.hero{position:relative;overflow:hidden;padding:7vh 5vw;background:radial-gradient(circle at 80% 30%,#1b4a9a,#0a1a40 55%,var(--bg))}
.hero::before{content:"";position:absolute;inset:-40% -10%;background:repeating-linear-gradient(120deg,transparent 0 60px,#7eb0ee1c 60px 110px);animation:slide 20s linear infinite}
@keyframes slide{to{transform:translateX(220px)}}
@keyframes float{50%{transform:translateY(-14px) rotate(2deg)}}
.heroimg{position:relative;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.heroimg img{width:min(320px,62vw);height:auto;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 16px 36px #000a)}
.hero h1{font-size:clamp(56px,13vw,140px);margin:0;line-height:.92;background:linear-gradient(90deg,#fff,var(--g1));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 span{background:linear-gradient(90deg,#ffe08a,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-weight:700;text-transform:uppercase;letter-spacing:2px;font-size:clamp(12px,2vw,16px);margin:14px 0 26px;color:#dbe6ff}
.hero .btn{margin:0 8px 8px 0}
.strip{display:grid;grid-template-columns:repeat(3,1fr);max-width:1100px;margin:-28px auto 0;padding:0 5vw;position:relative;gap:12px}
.stat{background:var(--card);border:1px solid var(--ln);border-bottom:3px solid var(--gold);border-radius:12px;text-align:center;padding:12px 6px}
.stat b{display:block;font-size:34px;color:var(--gold);line-height:1}
.stat span{font-size:12px;color:var(--mu);text-transform:uppercase}
main{padding:28px 5vw 60px;max-width:1100px;margin:0 auto}
h2{margin:0 0 14px;font-size:32px;border-left:6px solid var(--gold);padding-left:12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:18px}
.nt{border-left:4px solid var(--gold)}
.mu{color:var(--mu);font-size:13px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:9px;font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}
.chk input{width:auto;margin:0}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px;padding:2px 6px}
.badge{display:inline-block;font-size:12px;font-weight:700;background:var(--ln);border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0}
.av{border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-weight:800;display:grid;place-items:center;flex:none}
.ph{border-radius:50%;object-fit:cover;flex:none;display:block}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:20px 0 6px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;width:31%;max-width:190px;position:relative}
.pod b{font-family:var(--hf);font-size:clamp(14px,3.4vw,20px);text-transform:uppercase;margin:8px 0}
.p1{order:2}.p2{order:1}.p3{order:3}
.ring{padding:4px;border-radius:50%;background:linear-gradient(135deg,#ffe08a,var(--gold));box-shadow:0 0 30px #f5c45177}
.p2 .ring{background:linear-gradient(135deg,#f1f4fa,#9aa7bf);box-shadow:0 0 20px #9aa7bf55}
.p3 .ring{background:linear-gradient(135deg,#f0b27a,#a8643a);box-shadow:0 0 20px #a8643a55}
.crown{font-size:28px;margin-bottom:-6px}
.base{width:100%;display:grid;place-items:center;font-size:40px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,var(--g1),var(--g2));color:#fff}
.p1 .base{height:96px;background:linear-gradient(180deg,#ffe08a,var(--gold));color:#2a1d00}.p2 .base{height:68px}.p3 .base{height:50px}
.rk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}
.n{width:30px;font-size:22px;color:var(--gold)}
.ctl{margin-left:auto;white-space:nowrap}
.cam{cursor:pointer}
.game{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--ln);border-left:5px solid var(--gold);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.game.past{opacity:.55;border-left-color:var(--ln)}
.dt{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:10px;text-align:center;padding:6px 12px;min-width:62px}
.dt b{display:block;font-size:30px;line-height:1}.dt span{font-size:12px;font-weight:700}
.gi{flex:1}.tm{font-size:26px;color:var(--gold);line-height:1.1}
.vs{font-weight:700}.vs i{color:var(--mu);font-weight:400;padding:0 4px}
.tbl{overflow-x:auto}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:14px;max-width:360px;width:90%}
dialog::backdrop{background:#000a}
footer{text-align:center;padding:24px 5vw 40px;color:var(--mu);font-size:12px;border-top:1px solid var(--ln)}
</style>
</head>

  if(!rl)return{error:'auth'};
  if(q.a==='login')return{role:rl};
  if(q.a==='list'){const d={};COLS.forEach(c=>d[c]=Object.values(L[c]||{}));return{role:rl,data:d}}
  if(rl!=='coach')return{error:'forbidden'};
  if(q.a==='put'){(L[q.c]=L[q.c]||{})['k'+q.o.id]=q.o}
  else if(q.a==='del'){delete (L[q.c]||{})['k'+q.id]}
  else if(q.a==='parents')return{parents:Object.keys(L.parents)};
  else if(q.a==='addParent')L.parents[q.nu]=q.np;
  else if(q.a==='delParent')delete L.parents[q.nu];
  sv();return{ok:true};
}
async function put(c,o){
  const i=S[c].findIndex(x=>x.id===o.id);if(i>=0)S[c][i]=o;else S[c].push(o);sortS();render();
  try{const r=await api({a:'put',c,o});if(r.error)alert('No se pudo guardar.')}catch(e){alert('Sin conexión. No se guardó.')}
  lastJ='';load();
}
async function del(c,id){
  S[c]=S[c].filter(x=>x.id!==id);render();

}

function vNotices(){
  const f=coach()?`<div class="card"><h3>Nuevo aviso</h3><label>Título</label><input id="nt"><label>Mensaje</label><textarea id="nx" rows="3"></textarea><label>Categoría</label>${catSel('nc')}<button class="btn" onclick="addNotice()">Publicar</button></div>`:'';
  const l=S.notices.filter(mt).map(n=>`<div class="card nt"><h3>${esc(n.title)} ${coach()?`<button class="x" onclick="delItem('notices',${n.id})">✕</button>`:''}</h3><div class="mu">${fmt(n.date)} · ${n.cat==='all'?'Todas las categorías':CATS.find(c=>c[0]===n.cat)[1]}</div><p>${esc(n.text)}</p></div>`).join('')||'<p class="mu">Sin avisos.</p>';
  return `<main><h2>Avisos</h2>${f}${l}</main>`;
}
function addNotice(){const t=$('nt').value.trim(),x=$('nx').value.trim();if(!t)return;put('notices',{id:uid(),title:t,text:x,date:today(),cat:$('nc').value})}

function vGames(){
  const up=upGames(),pa=S.games.filter(g=>g.cat===cat&&g.date<today()).sort((a,b)=>a.date<b.date?1:-1);
  const f=coach()?`<div class="card"><h3>Programar juego · ${cl()}</h3><label>Fecha</label><input type="date" id="gd" value="${today()}"><label>Hora</label><input type="time" id="gt"><label>Rival</label><input id="gr"><label>Lugar o cancha</label><input id="gp"><label>Torneo (opcional)</label><input id="gn"><button class="btn" onclick="addGame()">Agregar juego</button></div>`:'';
  return `<main><h2>Horario de juegos · ${cl()}</h2>${f}${up.map(g=>gcard(g,false)).join('')||'<p class="mu">Sin juegos programados.</p>'}${pa.length?'<h3 class="mu" style="margin-top:24px">Juegos anteriores</h3>'+pa.map(g=>gcard(g,true)).join(''):''}</main>`;
}
function addGame(){if(!$('gd').value)return;put('games',{id:uid(),cat,date:$('gd').value,time:$('gt').value,rival:$('gr').value.trim(),place:$('gp').value.trim(),torneo:$('gn').value.trim()})}

function vRank(){
  const l=cp();let adm='';
  if(coach()){
    adm=`<div class="card"><h3>Administrar ranking · ${cl()}</h3>${l.map((p,i)=>`<div class="rk"><b class="n">${i+1}</b><label class="cam">${av(p,46)}<input type="file" accept="image/*" hidden onchange="setPhoto(${p.id},this)"></label><span>${esc(p.name)}</span><span class="ctl"><button class="x" onclick="mv(${p.id},-1)">↑</button><button class="x" onclick="mv(${p.id},1)">↓</button><button class="x" onclick="delPlayer(${p.id})">✕</button></span></div>`).join('')}
    <p class="mu">Toca la foto para cambiarla. Usa ↑ ↓ para ordenar el ranking.</p><h3>Agregar jugador</h3><label>Nombre</label><input id="pn"><label>Foto</label><input type="file" id="pf" accept="image/*"><button class="btn sm" onclick="addPlayer()">Agregar</button></div>`;
  }
  return `<main><h2>Top jugadores · ${cl()}</h2><div class="card">${podium(l)}${restRows(l)}</div>${adm}</main>`;
}
function shrink(f,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);cb(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(f)}
function setPhoto(id,inp){const f=inp.files[0];if(!f)return;shrink(f,d=>{const p=S.players.find(p=>p.id===id);if(p)put('players',{...p,photo:d})})}
function addPlayer(){const n=$('pn').value.trim();if(!n)return;const f=$('pf').files[0];const add=ph=>put('players',{id:uid(),cat,name:n,photo:ph||'',order:Date.now()});f?shrink(f,add):add('')}
function delPlayer(id){if(!confirm('¿Eliminar jugador?'))return;del('players',id)}
function mv(id,d){const l=cp(),k=l.findIndex(p=>p.id===id),j=k+d;if(j<0||j>=l.length)return;const a=l[k],b=l[j];put('players',{...a,order:b.order});put('players',{...b,order:a.order})}

function vAtt(){
  if(!role)return lock('la asistencia');
  let form='';
  if(coach()){
    const ex=cs().find(s=>s.date===today());
    form=`<div class="card"><h3>Registrar asistencia</h3><label>Fecha de la clase</label><input type="date" id="ad" value="${today()}" onchange="loadAtt()"><div id="alist">${attList(ex?ex.present:[])}</div><br><button class="btn" onclick="saveAtt()">Guardar asistencia</button></div>`;
  }
  const rows=cp().map(p=>{const n=cs().filter(s=>s.present.includes(p.id)).length,t=cs().length;return `<tr><td>${esc(p.name)}</td><td>${n}/${t}</td><td>${t?Math.round(n*100/t):0}%</td></tr>`}).join('');
  const hist=cs().slice().sort((a,b)=>a.date<b.date?1:-1).map(s=>`<span class="badge">${fmt(s.date)}: ${s.present.length}/${cp().length}</span>`).join(' ');
  return `<main><h2>Asistencia · ${cl()}</h2>${form}<div class="card tbl"><h3>Resumen por jugador</h3><table width="100%" cellpadding="6"><tr class="mu"><td>Jugador</td><td>Clases</td><td>%</td></tr>${rows}</table></div><div class="card"><h3>Clases registradas</h3>${hist||'<span class="mu">Aún no hay clases.</span>'}</div></main>`;
}
function attList(sel){return cp().map(p=>`<label class="chk"><input type="checkbox" value="${p.id}" ${sel.includes(p.id)?'checked':''}> ${av(p,30)} <span style="color:var(--tx)">${esc(p.name)}</span></label>`).join('')||'<p class="mu">Agrega jugadores en «Top jugadores».</p>'}
function loadAtt(){const ex=cs().find(s=>s.date===$('ad').value);$('alist').innerHTML=attList(ex?ex.present:[])}
function saveAtt(){
  const d=$('ad').value;if(!d)return;
  const present=[...document.querySelectorAll('#alist input:checked')].map(i=>+i.value);
  put('sessions',{id:cat+'_'+d,date:d,cat,present});
}

function gate(){
  if(state==='loading')return '<main><p class="mu">Cargando…</p></main>';
  if(state==='err')return '<main><div class="card"><h3>No se pudo cargar</h3><p>Revisa tu conexión a internet e intenta de nuevo.</p><button class="btn sm" onclick="boot()">Reintentar</button></div></main>';
  return `<main><div class="card" style="max-width:380px;margin:30px auto;text-align:center"><img src="${document.querySelector('.logo img').src}" alt="" style="height:120px;width:auto"><h3>Yeyo Úraga · Béisbol</h3><p class="mu">Ingresa con el usuario y la clave que te dio el entrenador.</p>
  <input id="lu" placeholder="Usuario" autocapitalize="none" autocomplete="username"><input id="lp" type="password" placeholder="Clave" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn" style="width:100%" onclick="doLogin()">Entrar</button><p class="mu" id="lerr" style="color:#ff8a6b"></p>${DEMO?'<p class="mu">🧪 Modo prueba: usuario entrenador, clave 1234.</p>':''}<p class="mu">📱 Para instalar la app: en Android toca «Instalar app»; en iPhone toca Compartir y luego «Añadir a pantalla de inicio».</p></div></main>`;
}
const demoBanner=()=>DEMO?'<div class="card"><h3>🧪 Modo prueba</h3><p class="mu">Los datos solo se guardan en este navegador. Conecta tu Apps Script (ver la guía) para compartirlos con las familias.</p></div>':'';
async function doLogin(){
  const u=$('lu').value.trim().toLowerCase(),p=$('lp').value;if(!u||!p)return;
  CRED={u,p};$('lerr').textContent='Verificando…';
  try{
    const r=await api({a:'login'});
    if(r.error){CRED=null;$('lerr').textContent='Usuario o clave incorrectos';return}
    try{localStorage.setItem('yu_auth',JSON.stringify(CRED))}catch(e){}
    state='loading';render();load();
  }catch(e){CRED=null;$('lerr').textContent='Sin conexión. Intenta de nuevo.'}
}
function logout(){CRED=null;try{localStorage.removeItem('yu_auth')}catch(e){};role='parent';state='login';lastJ='';tab='home';render()}
async function load(){
  try{
    const r=await api({a:'list'});
    if(r.error==='auth'){logout();return}
    if(r.error)throw 0;
    role=r.role;S=r.data;sortS();
    const j=JSON.stringify(S)+role;
    if(state==='ok'&&j===lastJ)return;
    const t=document.activeElement&&document.activeElement.tagName;
    if(state==='ok'&&lastJ&&(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'))return;
    lastJ=j;state='ok';render();
  }catch(e){if(state==='loading'){state='err';render()}}
}
async function loadParents(){try{const r=await api({a:'parents'});PARENTS=r.parents||[]}catch(e){}render()}
function vFam(){
  if(!coach())return '';
  return `<main><h2>Familias con acceso</h2><div class="card"><h3>Nueva familia</h3><label>Usuario (letras y números, mínimo 3)</label><input id="fu" autocapitalize="none"><label>Clave (mínimo 4)</label><input id="fp"><button class="btn" onclick="addFam()">Crear acceso</button><p class="mu">Entrega el usuario y la clave a la familia. Entran desde su celular con esos datos.</p></div>
  <div class="card"><h3>Accesos creados</h3>${PARENTS.map(u=>`<div class="chk">${esc(u)}<button class="x" style="margin-left:auto" onclick="delFam('${esc(u)}')">✕</button></div>`).join('')||'<p class="mu">Aún no hay familias.</p>'}</div></main>`;
}
async function addFam(){
  const u=$('fu').value.trim().toLowerCase(),p=$('fp').value.trim();
  if(!/^[a-z0-9._-]{3,}$/.test(u)||u==='entrenador'||p.length<4){alert('Usuario: mínimo 3 letras o números, sin espacios. Clave: mínimo 4 caracteres.');return}
  try{const r=await api({a:'addParent',nu:u,np:p});if(r.error){alert('No se pudo crear');return}}catch(e){alert('Sin conexión');return}
  loadParents();
}
async function delFam(u){if(!confirm('¿Quitar el acceso de '+u+'?'))return;try{await api({a:'delParent',nu:u})}catch(e){}loadParents()}
function boot(){
  try{CRED=JSON.parse(localStorage.getItem('yu_auth'))}catch(e){CRED=null}
  if(!CRED){state='login';render();return}
  state='loading';render();load();
}
function render(){
  const ok=state==='ok';
  $('cats').style.display=ok?'':'none';
  $('cats').innerHTML=CATS.map(([k,l])=>`<button class="${cat===k?'on':''}" onclick="setCat('${k}')">${l}</button>`).join('');
  $('nav').innerHTML=ok?TABS.filter(([k])=>k!=='fam'||coach()).map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join(''):'';
  $('acc').style.display=ok?'':'none';
  $('acc').textContent=coach()?'Entrenador · Salir':'Salir';
  $('app').innerHTML=ok?{home:vHome,notices:vNotices,games:vGames,rank:vRank,att:vAtt,fam:vFam}[tab]():gate();
}
let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('inst').style.display=''});
addEventListener('appinstalled',()=>{dip=null;$('inst').style.display='none'});
function installApp(){if(dip){dip.prompt();dip=null;$('inst').style.display='none'}}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();boot();
setInterval(()=>{if(CRED&&state==='ok'&&!document.hidden)load()},45000);
</script>
</body>
</html>
